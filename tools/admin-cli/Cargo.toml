[package]
name = "admin-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "admin-cli"
path = "src/main.rs"

[dependencies]
anchor-lang = "1.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
family-vault = { version = "0.1.0", path = "../../programs/family-vault", features = ["cpi"] }
solana-client = "=4.2.2"
solana-hash = "3.0.0"
solana-instruction = "3.0.0"
solana-keypair = "3.0.1"
solana-message = { version = "4.1.0", features = ["wincode"] }
solana-pubkey = "=4.2.1"
solana-signature = "=3.4.1"
solana-signer = "3.0.0"
solana-transaction = { version = "4.1.6", features = ["wincode"] }
spl-associated-token-account = { version = "8.0.0", features = ["no-entrypoint"] }
spl-token = { version = "9.0.0", features = ["no-entrypoint"] }

[lints.rust]
unsafe_code = "deny"
dead_code = "deny"
