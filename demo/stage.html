<!doctype html>
<meta charset="utf-8">
<title>stage</title>
<style>
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0f1419;color:#fff;font-family:system-ui,sans-serif}
  .stage{position:absolute;inset:0 0 170px 0;display:flex;gap:60px;align-items:center;justify-content:center}
  .col{display:flex;flex-direction:column;align-items:center}
  .label{font-size:26px;opacity:.7;margin-bottom:14px}
  .kiosk{position:relative;width:880px;height:528px;border:6px solid #fff;border-radius:18px;background:#fff;overflow:hidden}
  .kiosk img{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .35s}
  .kiosk img.on{opacity:1}
  .finger{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(79,209,165,.55);border:3px solid #4fd1a5;opacity:0;pointer-events:none}
  .finger.tap{animation:tap .6s ease-out}
  @keyframes tap{0%{opacity:0;transform:scale(1.8)}25%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.5)}}
  .phone{position:relative;width:400px;height:800px;border:6px solid #fff;border-radius:34px;overflow:hidden;background:#000}
  iframe{width:400px;height:800px;border:0;background:#0f1419}
  .link{width:340px;text-align:center}
  .via{display:inline-block;padding:6px 18px;border-radius:999px;border:2px solid #4fd1a5;color:#4fd1a5;font-size:26px;transition:opacity .3s}
  .track{position:relative;height:110px;margin:6px 20px}
  .track:before{content:"";position:absolute;left:0;right:0;top:54px;height:4px;background:#4fd1a5;opacity:.35;border-radius:2px}
  .dot{position:absolute;top:44px;width:24px;height:24px;border-radius:50%;background:#4fd1a5;box-shadow:0 0 16px #4fd1a5;opacity:0}
  .track.right .dot{animation:toright 1.4s ease-in-out infinite;opacity:1}
  .track.left .dot{animation:toleft 1.4s ease-in-out infinite;opacity:1}
  .track.both .dot{animation:both 2.4s ease-in-out infinite;opacity:1}
  @keyframes toright{0%{left:0}100%{left:296px}}
  @keyframes toleft{0%{left:296px}100%{left:0}}
  @keyframes both{0%{left:0}50%{left:296px}100%{left:0}}
  .what{font-size:28px;line-height:1.3;opacity:.9;min-height:110px}
  .caption{position:absolute;left:0;right:0;bottom:0;height:170px;display:flex;align-items:center;justify-content:center;padding:0 120px;font-size:40px;line-height:1.3;text-align:center;background:#000;transition:opacity .4s}
  #cursor{position:absolute;left:0;top:0;width:34px;height:34px;pointer-events:none;z-index:10;transition:transform .7s cubic-bezier(.3,.1,.2,1);filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
  #ripple{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:4px solid #fff;opacity:0;pointer-events:none;z-index:9}
  #ripple.go{animation:ripple .5s ease-out}
  @keyframes ripple{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(3)}}
</style>
<div class="stage">
  <div class="col"><div class="label">Kiosk (Rust, Slint)</div>
    <div class="kiosk" id="kiosk"><img id="k0"><img id="k1"><div class="finger" id="finger"></div></div></div>
  <div class="link"><div class="via" id="via"></div><div class="track" id="track"><div class="dot"></div></div><div class="what" id="what"></div></div>
  <div class="col"><div class="label">Family app (Tauri)</div>
    <div class="phone"><iframe id="app"></iframe></div></div>
</div>
<div class="caption" id="caption"></div>
<svg id="cursor" viewBox="0 0 24 24" style="transform:translate(1500px,900px)"><path d="M3 2l7 19 3-8 8-3z" fill="#fff" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/></svg>
<div id="ripple"></div>
<script>
  const $ = (id) => document.getElementById(id);
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  let front = 0;
  const arrows = { right: 'from the kiosk', left: 'from the app', both: 'both ways' };

  const stage = {
    async load(url) {
      await new Promise((r) => { $('app').onload = r; $('app').src = url; });
    },
    caption(text) {
      $('caption').style.opacity = 0;
      setTimeout(() => { $('caption').textContent = text; $('caption').style.opacity = 1; }, 250);
    },
    link(l) {
      $('via').style.opacity = l ? 1 : 0;
      $('via').textContent = l ? l.via : '-';
      $('track').className = 'track ' + (l ? l.dir : '');
      $('what').textContent = l ? l.label : 'not connected yet';
    },
    show(src) {
      const next = $('k' + (1 - front));
      next.src = src;
      next.onload = () => { next.classList.add('on'); $('k' + front).classList.remove('on'); front = 1 - front; };
    },
    async tap(x, y) {
      const f = $('finger');
      f.style.left = x * 100 + '%';
      f.style.top = y * 100 + '%';
      f.classList.remove('tap'); void f.offsetWidth; f.classList.add('tap');
    },
    async point(el) {
      const frame = $('app').getBoundingClientRect();
      const r = el.getBoundingClientRect();
      const x = frame.left + r.left + Math.min(r.width / 2, 60);
      const y = frame.top + r.top + r.height / 2;
      $('cursor').style.transform = `translate(${x}px,${y}px)`;
      await sleep(800);
      const rp = $('ripple');
      rp.style.left = x + 'px'; rp.style.top = y + 'px';
      rp.classList.remove('go'); void rp.offsetWidth; rp.classList.add('go');
      await sleep(180);
    },
    doc() { return $('app').contentDocument; },
    async find(selector, label, ms = 60000) {
      const end = Date.now() + ms;
      while (Date.now() < end) {
        const d = stage.doc();
        const el = label !== undefined
          ? [...d.querySelectorAll('button,a')].find((e) => e.textContent.trim().replace(/\d+$/, '').trim() === label)
          : d.querySelector(selector);
        if (el) return el;
        await sleep(100);
      }
      throw new Error('not found: ' + (label ?? selector));
    },
    async click(label) {
      const el = await stage.find(null, label);
      await stage.point(el);
      el.click();
    },
    async fill(selector, value) {
      const el = await stage.find(selector);
      await stage.point(el);
      el.focus();
      el.value = '';
      for (const ch of value) {
        el.value += ch;
        el.dispatchEvent(new Event('input', { bubbles: true }));
        await sleep(90);
      }
    },
    async select(selector, value) {
      const el = await stage.find(selector);
      await stage.point(el);
      el.value = value;
      el.dispatchEvent(new Event('change', { bubbles: true }));
    },
    async wait(text, ms = 60000) {
      const end = Date.now() + ms;
      while (Date.now() < end) {
        if (stage.doc().body.innerText.includes(text)) return;
        await sleep(100);
      }
      throw new Error('timed out waiting for ' + text);
    },
    sleep,
  };
  window.stage = stage;
</script>
