[package]
name = "kiosk-gui"
version = "0.1.0"
edition = "2021"

[lib]
name = "kiosk_gui"

[dependencies]
anchor-lang = "1.2.0"
family-vault = { version = "0.1.0", path = "../programs/family-vault", features = ["cpi"] }
family-vault-client = { version = "0.1.0", path = "../tools/family-vault-client" }
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
slint = "1.18.0"
solana-client = "=4.2.2"
solana-hash = "3.0.0"
solana-instruction = "3.0.0"
solana-keypair = "3.0.1"
solana-message = { version = "4.1.0", features = ["wincode"] }
solana-pubkey = "=4.2.1"
solana-signature = "=3.4.1"
solana-signer = "3.0.0"
solana-transaction = { version = "4.1.6", features = ["wincode"] }
spl-associated-token-account = { version = "8.0.0", features = ["no-entrypoint"] }
spl-token = { version = "9.0.0", features = ["no-entrypoint"] }
toml = "1.1.6"
bluer = { version = "0.17.4", features = ["bluetoothd"] }
tokio = { version = "1", features = ["rt", "time", "macros", "sync"] }
futures = "0.3"

[lints.rust]
unsafe_code = "deny"
dead_code = "deny"

[build-dependencies]
slint-build = "1.18.0"

[dev-dependencies]
i-slint-backend-testing = "1.16.0"

# `i-slint-backend-testing`'s platform can only be initialized once per
# process (its own docs say so), and Rust's default `#[test]` harness runs
# each test function on its own freshly spawned OS thread -- even under
# `--test-threads=1` -- so a second test's thread never observes the
# platform context bound to the first test's thread and fails with
# NoEventLoopProvider. Disabling the harness lets tests/navigation.rs drive
# both scenarios from one single-threaded `main()` instead, so the platform
# is initialized exactly once and both scenarios run against it in sequence.
[[test]]
name = "navigation"
path = "tests/navigation.rs"
harness = false
