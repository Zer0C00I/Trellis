[package]
name = "family-vault"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "family_vault"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
default = []
# Anchor's #[program]/#[derive(Accounts)] macros unconditionally emit
# cfg(feature = "anchor-debug")/cfg(feature = "no-log-ix-name") checks even
# when neither feature is declared, which trips rustc's unexpected_cfgs
# lint. Declaring them as empty, unused features is Anchor's documented fix
# (https://www.anchor-lang.com/docs) — this silences the warning without
# suppressing the lint crate-wide.
anchor-debug = []
no-log-ix-name = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.0"
anchor-spl = { version = "1.2.0", features = ["token", "associated_token"] }

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
spl-associated-token-account = { version = "8.0.0", features = ["no-entrypoint"] }
spl-token = { version = "9.0.0", features = ["no-entrypoint"] }
