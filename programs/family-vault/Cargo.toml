[package]
name = "family-vault"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "family_vault"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = { version = "0.32.1", features = ["token", "associated_token"] }

[dev-dependencies]
litesvm = "0.9.1"
solana-sdk = "2.1.21"
spl-associated-token-account = "6.0.0"
spl-token = "7.0.0"
